name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libxi-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests (core, DSP, FX, formation)
        run: ./build/ih1_tests
      - name: Host-lifecycle tests (VST3, incl. editor resize stress)
        run: xvfb-run -a -s "-screen 0 1920x1200x24" ./build/plugin/ih1_hosttest_artefacts/Release/ih1_hosttest build/plugin/IH1_artefacts/Release/VST3/IH1.vst3
      - name: Editor interaction tests
        run: IH1_REQUIRE_GL=1 xvfb-run -a -s "-screen 0 1920x1200x24" ./build/plugin/ih1_uitest_artefacts/Release/ih1_uitest
      - name: pluginval (strictness 8; V2.1 passed 8 and 10 on Linux)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip
          unzip -o pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 8 --validate build/plugin/IH1_artefacts/Release/VST3/IH1.vst3
          echo "pluginval exit code: $?"
      - name: Engine soak (2 min of random workflow operations while audio runs)
        run: ./build/ih1_soak 120 12
      - name: CPU benchmark (informational)
        run: ./build/ih1_bench 48000 256 2
      - uses: actions/upload-artifact@v4
        with:
          name: IH1-linux-vst3
          path: build/plugin/IH1_artefacts/Release/VST3/IH1.vst3

  # V6 P0: the FL Studio access violation was an out-of-bounds read that is silent in most heap layouts. The real
  # editor is driven under AddressSanitizer so that class of defect fails CI instead of shipping.
  linux-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libxi-dev xvfb
      - name: Configure (Debug + AddressSanitizer)
        run: >
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_C_FLAGS=-fsanitize=address
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
          -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address
      - name: Build the editor interaction tests
        run: cmake --build build-asan --target ih1_uitest --parallel
      - name: Editor interaction tests under ASan (any ASan report fails the job)
        run: ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 xvfb-run -a -s "-screen 0 1920x1200x24" ./build-asan/plugin/ih1_uitest_artefacts/Debug/ih1_uitest

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: build\Release\ih1_tests.exe
        shell: cmd
      - name: Host-lifecycle tests (VST3)
        run: build\plugin\ih1_hosttest_artefacts\Release\ih1_hosttest.exe build\plugin\IH1_artefacts\Release\VST3\IH1.vst3
        shell: cmd
      - name: Editor interaction tests
        run: build\plugin\ih1_uitest_artefacts\Release\ih1_uitest.exe
        shell: cmd
      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $exe = (Get-ChildItem -Recurse -Filter pluginval.exe pluginval | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          # pluginval is a GUI-subsystem app: wait for it explicitly and propagate its exit code
          $p = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow -ArgumentList @(
            '--strictness-level', '5', '--output-dir', "$PWD\pluginval-logs",
            '--validate', "$PWD\build\plugin\IH1_artefacts\Release\VST3\IH1.vst3")
          Get-ChildItem pluginval-logs -Filter *.txt | ForEach-Object { Get-Content $_.FullName }
          Write-Host "pluginval exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Stage files for the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage\VST3, stage\Standalone | Out-Null
          Copy-Item -Recurse -Force build\plugin\IH1_artefacts\Release\VST3\IH1.vst3 stage\VST3\
          Copy-Item -Force build\plugin\IH1_artefacts\Release\Standalone\IH1.exe stage\Standalone\
          Copy-Item -Force README.md, installer\THIRD_PARTY_NOTICES.txt, installer\INSTALL_NOTES.txt stage\
          if (Get-ChildItem -Recurse stage -Include *.pdb, *.ilk, *.dmp) { throw 'debug files must not be shipped in the installer' }
      - name: Build setup wizard (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(IH1 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver" "/DTestRound=5" "/DSourceDir=$PWD\stage" installer\IH1.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package the test build ZIP (installer + install README)
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(IH1 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "IH1_${ver}_Windows_Installer_Round-5"
          New-Item -ItemType Directory -Force "zip\$name" | Out-Null
          Copy-Item -Force "dist\IH1-Setup-$ver.exe" "zip\$name\"
          (Get-Content installer\README_TESTBUILD.txt -Raw).Replace('{VERSION}', $ver).Replace('{COMMIT}', "${env:GITHUB_SHA}".Substring(0, 7)) | Set-Content -Encoding utf8 "zip\$name\README.txt"
          Compress-Archive -Force -Path "zip\$name\*" -DestinationPath "dist\$name.zip"
          # verify: the archive opens and holds exactly the installer and the README
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead("$PWD\dist\$name.zip").Entries | ForEach-Object { $_.FullName }
          Write-Host "ZIP entries: $entries"
          if ($entries.Count -ne 2) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IH1-windows-pluginval-log
          path: pluginval-logs
      - uses: actions/upload-artifact@v4
        with:
          name: IH1-windows-setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: IH1-windows-testbuild-zip
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IH1-windows-vst3
          path: build/plugin/IH1_artefacts/Release/VST3/IH1.vst3
      # V6: symbols for crash-offset resolution (private CI artefact; never part of the installer or the ZIP)
      - uses: actions/upload-artifact@v4
        with:
          name: IH1-windows-pdb
          path: build/pdb/**/*.pdb
